<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroEcon | Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="navbar container">
            <div class="logo">
                <i class="fa-solid fa-seedling"></i> <span>Agro<span class="highlight">Econ</span></span>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="analises.html">Análises & Gráficos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero-section">
            <div class="hero-text">
                <h1>Portal de Economia na Agricultura</h1>
                <p>Indicadores financeiros, mercado de commodities e análises aprofundadas sobre o agronegócio.</p>
            </div>
        </section>

        <section class="dashboard-grid">
            <div class="card">
                <div class="card-icon"><i class="fa-solid fa-chart-line text-green"></i></div>
                <div class="card-info">
                    <h3>PIB do Agro</h3>
                    <p class="number">R$ 2.6 T</p>
                </div>
            </div>
            <div class="card">
                <div class="card-icon"><i class="fa-solid fa-wheat-awn text-amber"></i></div>
                <div class="card-info">
                    <h3>Safra de Grãos</h3>
                    <p class="number">315.4M t</p>
                </div>
            </div>
        </section>

        <section class="news-section">
            <h2><i class="fa-solid fa-newspaper"></i> Últimas Notícias Econômicas</h2>
            <div class="news-grid" id="newsContainer">
                </div>
        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 AgroEcon Analytics.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
